spring:
  config:
    import: optional:file:./application-local.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      connect-timeout: 3000ms
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/resume_ai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  secret: ${JWT_SECRET:local-dev-only-change-this-secret-key}
  expire: 86400000

mybatis.plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

file:
  upload-path: ${FILE_UPLOAD_PATH:D:/data/resume-upload/}

langchain4j:
  open-ai:
    chat-model:
      api-key: ${AI_API_KEY:}
      model-name: deepseek-chat
      temperature: 0.3
